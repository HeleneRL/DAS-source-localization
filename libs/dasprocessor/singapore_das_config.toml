# Singapore DAS bulk matched-filter configuration
# Edit only the paths / anchors / channels if needed.

[general]
data_root = 'D:\\Singapore Data'
output_root = 'D:\\Singapore Data\\processed_outputs\\lfm_35_45_bulk'
locations_to_process = ['loc2_tx3', 'loc3_tx1', 'loc4_tx1', 'loc5_tx1', 'loc6_tx1', 'loc7_tx1']

[acquisition]
max_channel_exclusive = 3000
channel_start = 0
channel_block_size = 32

[signal]
fs_nominal_hz = 25000.0
lfm_f0_hz = 3500.0
lfm_f1_hz = 4500.0
lfm_duration_s = 5.0
reference_window = 'hann'

[search]
search_before_s = 2.0
search_after_s = 2.0
# The raw data window must be longer than the search span because the matched filter
# needs the full 5 s chirp available for every candidate start time.
# Raw window length = search_before + search_after + lfm_duration.
peak_threshold_snr = 4.0
warn_if_peak_within_s = 0.05
correlation_method = 'fft'

[outputs]
save_per_location_csv = true
save_combined_csv = true
save_run_metadata_json = true

